<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kn_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096e6"/>
      <stop offset="100%" stop-color="#006fa8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners (Material 3 style) -->
  <rect width="64" height="64" rx="16" fill="url(#kn_grad)"/>
  <!-- Note sheet -->
  <rect x="15" y="13" width="34" height="38" rx="6" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Checklist / note lines inside -->
  <!-- Line 1 check -->
  <path d="M20 22L23 25L28 20" stroke="#0082C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="31" y="21.5" width="13" height="2" rx="1" fill="#94A3B8"/>
  <!-- Line 2 check -->
  <path d="M20 30L23 33L28 28" stroke="#0082C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="31" y="29.5" width="13" height="2" rx="1" fill="#94A3B8"/>
  <!-- Line 3 empty box / line -->
  <rect x="20" y="37" width="7" height="7" rx="2" stroke="#CBD5E1" stroke-width="1.8" fill="none"/>
  <rect x="31" y="39.5" width="11" height="2" rx="1" fill="#94A3B8"/>
</svg>
