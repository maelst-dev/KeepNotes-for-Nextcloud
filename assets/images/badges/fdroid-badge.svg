<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 56" width="190" height="56" fill="none">
  <rect width="190" height="56" rx="12" fill="#1E293B"/>
  <rect x="1" y="1" width="188" height="54" rx="11" stroke="#334155" stroke-width="1.5"/>
  
  <!-- F-Droid Robot Icon -->
  <g transform="translate(14, 11)">
    <!-- Antennae -->
    <line x1="9" y1="5" x2="6" y2="1" stroke="#1976D2" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="5" x2="26" y2="1" stroke="#1976D2" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Head -->
    <path d="M7 11C7 7 10 5 16 5C22 5 25 7 25 11V12H7V11Z" fill="#1976D2"/>
    <circle cx="11.5" cy="8.5" r="1.2" fill="#FFFFFF"/>
    <circle cx="20.5" cy="8.5" r="1.2" fill="#FFFFFF"/>
    <!-- Body -->
    <rect x="7" y="14" width="18" height="15" rx="3" fill="#1976D2"/>
    <!-- Screen inside body -->
    <rect x="9.5" y="16.5" width="13" height="10" rx="1.5" fill="#FFFFFF"/>
    <rect x="11.5" y="18.5" width="9" height="6" rx="1" fill="#0082C9"/>
    <!-- Legs -->
    <rect x="10" y="29" width="3" height="4" rx="1.5" fill="#1976D2"/>
    <rect x="19" y="29" width="3" height="4" rx="1.5" fill="#1976D2"/>
    <!-- Arms -->
    <rect x="2.5" y="14" width="3" height="11" rx="1.5" fill="#1976D2"/>
    <rect x="26.5" y="14" width="3" height="11" rx="1.5" fill="#1976D2"/>
  </g>

  <!-- Text -->
  <text x="56" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.8">AVAILABLE ON</text>
  <text x="56" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">F-Droid</text>
</svg>
